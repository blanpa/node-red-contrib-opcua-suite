<link rel="stylesheet" href="resources/node-red-contrib-opcua-suite/opcua-editor.css" />
<script src="resources/node-red-contrib-opcua-suite/opcua-editor.js"></script>

<script type="text/javascript">
    // Every operation opcua-client.js executes. The dialog offers all of them,
    // and test/editor-contract.test.js keeps this list in sync with the code.
    var OPCUA_CLIENT_OPERATIONS = [
        ["read", "Read"],
        ["readmultiple", "Read multiple"],
        ["write", "Write"],
        ["writemultiple", "Write multiple"],
        ["subscribe", "Subscribe"],
        ["unsubscribe", "Unsubscribe"],
        ["browse", "Browse"],
        ["method", "Call method"],
        ["history", "History read"],
        ["readattribute", "Read attribute"],
        ["translatebrowsepath", "Translate browse path"],
        ["registernodes", "Register nodes"],
        ["unregisternodes", "Unregister nodes"],
        ["getendpoints", "Get endpoints"],
    ];

    RED.nodes.registerType("opcua-client", {
        category: "OPC UA Suite",
        color: "#3a8cba",
        defaults: {
            name: { value: "" },
            endpoint: { value: "", type: "opcua-endpoint", required: true },
            defaultOperation: { value: "read" },
            // Connection settings that moved to the endpoint. Kept so older
            // flows still work: the endpoint falls back to them when it
            // does not set its own values. New nodes leave them empty.
            applicationName: { value: "" },
            maxReconnectAttempts: { value: "" },
            reconnectDelay: { value: "" },
            retryAttempts: { value: 0 },
            maxOperationRetries: { value: 3 },
            retryBackoffMs: { value: 100 },
            verboseLog: { value: true },
            autoConnect: { value: true },
            unwrapSingle: { value: false },
        },
        inputs: 1,
        outputs: 1,
        icon: "opcua.svg",
        paletteLabel: "OPC UA Client",
        label: function () {
            return this.name || "OPC UA Client";
        },
        labelStyle: function () {
            return this.name ? "node_label_italic" : "";
        },
        oneditprepare: function () {
            var node = this;
            var $op = $("#node-input-defaultOperation");
            OPCUA_CLIENT_OPERATIONS.forEach(function (o) {
                $("<option>").val(o[0]).text(o[1]).appendTo($op);
            });
            OpcUaEditor.keepValue($op, node.defaultOperation || "read");

            // Older flows set connection settings on the client node. They
            // still apply as a fallback, so say where they belong now.
            var legacy = [];
            if (node.applicationName && node.applicationName !== "Node-RED OPC UA Client") {
                legacy.push("application name " + node.applicationName);
            }
            if (node.maxReconnectAttempts !== "" && node.maxReconnectAttempts !== undefined && Number(node.maxReconnectAttempts) !== 10) {
                legacy.push("reconnect attempts " + node.maxReconnectAttempts);
            }
            if (node.reconnectDelay !== "" && node.reconnectDelay !== undefined && Number(node.reconnectDelay) !== 5000) {
                legacy.push("reconnect delay " + node.reconnectDelay + " ms");
            }
            if (legacy.length) {
                $("#opcua-client-legacy")
                    .text(
                        "This node still sets " + legacy.join(", ") +
                        ". These settings now belong to the endpoint; they keep " +
                        "working here until the endpoint sets its own values.",
                    )
                    .show();
            }

            if (
                Number(node.retryAttempts) !== 0 ||
                Number(node.maxOperationRetries) !== 3 ||
                Number(node.retryBackoffMs) !== 100
            ) {
                OpcUaEditor.expand("#opcua-client-retry");
            }
            OpcUaEditor.sections("#opcua-client-form");
        },
    });
</script>

<script type="text/html" data-template-name="opcua-client">
    <div class="opcua-form" id="opcua-client-form">
        <div class="form-row">
            <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
            <input type="text" id="node-input-name" placeholder="Name" />
        </div>
        <div class="form-row">
            <label for="node-input-endpoint"><i class="fa fa-plug"></i> Endpoint</label>
            <input type="text" id="node-input-endpoint" />
        </div>
        <div class="form-row">
            <label for="node-input-defaultOperation"><i class="fa fa-cog"></i> Operation</label>
            <select id="node-input-defaultOperation"></select>
        </div>
        <div class="opcua-hint">Used when the message has no <code>msg.operation</code>.</div>

        <div class="opcua-check">
            <input type="checkbox" id="node-input-autoConnect" />
            <label for="node-input-autoConnect">
                Connect on deploy
                <span class="opcua-check-hint">Otherwise the first message opens the connection.</span>
            </label>
        </div>
        <div class="opcua-check">
            <input type="checkbox" id="node-input-unwrapSingle" />
            <label for="node-input-unwrapSingle">
                Unwrap a single value
                <span class="opcua-check-hint">A read of one item returns the value itself, not a one-element array.</span>
            </label>
        </div>
        <div class="opcua-check">
            <input type="checkbox" id="node-input-verboseLog" />
            <label for="node-input-verboseLog">
                Verbose log
                <span class="opcua-check-hint">Log reconnects and warnings.</span>
            </label>
        </div>

        <div class="opcua-section opcua-collapsed" id="opcua-client-retry">
            <div class="opcua-section-header">
                <i class="fa opcua-chevron"></i>
                <span class="opcua-section-title">On connection loss</span>
            </div>
            <div class="opcua-section-body">
                <div class="form-row">
                    <label for="node-input-maxOperationRetries"><i class="fa fa-repeat"></i> Retries</label>
                    <input type="number" class="opcua-num" id="node-input-maxOperationRetries" min="0" max="20" placeholder="3" />
                    <span class="opcua-unit">per message</span>
                </div>
                <div class="opcua-hint">How often a message is retried after the connection was lost.</div>
                <div class="form-row">
                    <label for="node-input-retryBackoffMs"><i class="fa fa-clock-o"></i> Backoff</label>
                    <input type="number" class="opcua-num" id="node-input-retryBackoffMs" min="0" max="5000" placeholder="100" />
                    <span class="opcua-unit">ms, doubles per retry, at most 2 s</span>
                </div>
                <div class="form-row">
                    <label for="node-input-retryAttempts"><i class="fa fa-refresh"></i> Reconnects</label>
                    <input type="number" class="opcua-num" id="node-input-retryAttempts" min="0" max="1000" placeholder="0" />
                    <span class="opcua-unit">per retry, 0 = until connected</span>
                </div>
                <div class="opcua-note">
                    Connect attempts, reconnect delay and the application name are
                    set on the endpoint, because all nodes using it share one
                    connection.
                </div>
                <div class="opcua-note opcua-note-warning" id="opcua-client-legacy" style="display:none"></div>
            </div>
        </div>
    </div>
</script>

<script type="text/html" data-help-name="opcua-client">
    <p>
        OPC UA Client Node — Read, Write, Subscribe, Browse (single and batch).
    </p>

    <h3>Operations</h3>
    <p>
        Via <code>msg.operation</code> or default operation in the
        configuration:
    </p>
    <p>
        Every output (including the error output) carries the resolved
        operation in <code>msg.operation</code> — e.g. <code>"read"</code>,
        <code>"write"</code>, <code>"browse"</code>, or the more specific
        <code>"readmultiple"</code> / <code>"writemultiple"</code> when a batch
        ran — so a downstream <b>switch</b> node can branch on it.
    </p>

    <h4>Read (single)</h4>
    <ul>
        <li><code>msg.topic</code> / <code>msg.nodeId</code> — NodeId</li>
        <li>Output: <code>msg.payload</code> = value</li>
    </ul>

    <h4>Read Multiple (Batch)</h4>
    <ul>
        <li><code>msg.operation = "readmultiple"</code></li>
        <li>
            <code>msg.items</code> — Array:
            <code>[{nodeId: "ns=2;s=Var1"}, ...]</code>
        </li>
        <li>
            Or <code>msg.payload</code> — Object:
            <code>{"Name": "ns=2;s=Var1", ...}</code>
        </li>
    </ul>

    <h4>Write (single)</h4>
    <ul>
        <li><code>msg.topic</code> / <code>msg.nodeId</code> — NodeId</li>
        <li>
            <code>msg.payload</code> — value (plain value or ExtensionObject,
            see below)
        </li>
        <li>
            <code>msg.datatype</code> — Optional: DataType (e.g. "Int32",
            "Double", "DateTime", "ExtensionObject"). JSON values are converted
            to it: an ISO string or epoch ms for DateTime, "ns=2;s=X" for
            NodeId, base64 for ByteString.
        </li>
    </ul>

    <h4>Write Multiple (Batch)</h4>
    <ul>
        <li><code>msg.operation = "writemultiple"</code></li>
        <li>
            <code>msg.items</code> — Array:
            <code
                >[{nodeId: "ns=2;s=Var1", value: 42, datatype: "Int32"},
                ...]</code
            >
        </li>
        <li>
            Or <code>msg.payload</code> — Object:
            <code>{"ns=2;s=Var1": {value: 42, datatype: "Int32"}, ...}</code>
        </li>
    </ul>

    <h4>Subscribe / Browse / Method / History</h4>
    <p>See example flows for all supported operations.</p>

    <h3>Connection recovery</h3>
    <p>
        All nodes using an endpoint share one connection, so connect
        attempts, reconnect delay and the application name are set on the
        <b>endpoint</b>. Flows created with older versions may still carry
        them on the client node; there they keep working as a fallback until
        the endpoint sets its own values.
    </p>
    <h4>On connection loss</h4>
    <dl class="message-properties">
        <dt>Retries</dt>
        <dd>
            How often one message is retried after the connection was lost
            (default 3).
        </dd>
        <dt>Backoff</dt>
        <dd>
            Pause before the first retry; it doubles per retry, at most 2 s.
        </dd>
        <dt>Reconnects</dt>
        <dd>
            Reconnect attempts per retry; 0 keeps trying until the
            connection is back.
        </dd>
    </dl>
    <p>
        After a failed connect the node keeps reconnecting in the
        background and never gives up. The pause doubles from
        the endpoint's <i>Reconnect delay</i> up to one minute. A flow that only
        subscribes therefore connects as soon as the server is reachable,
        however long it was offline. A redeploy stops the old attempts.
        If the server drops an established connection, node-opcua restores
        the channel and the session itself, and subscriptions resume
        without a new <code>subscribe</code> message.
    </p>

    <h3>Unwrap single value</h3>
    <p>
        A read that resolves to exactly one item (e.g. one Item node, or a
        single-entry <code>msg.items</code>) normally returns a one-element
        array in <code>msg.payload</code>. Enable <b>Unwrap single value</b> to
        receive the scalar value directly instead, with its metadata
        (<code>dataType</code>, <code>statusCode</code>, <code>nodeId</code>, …)
        flattened onto <code>msg</code>. Override per message with
        <code>msg.unwrapSingle = true | false</code>. Reads of two or more items
        are unaffected.
    </p>

    <h3>ExtensionObject (Structured Types) Support</h3>
    <p>
        OPC UA <b>ExtensionObjects</b> (structured/complex data types) are fully
        supported for read, write, and subscribe operations.
    </p>

    <h4>Reading ExtensionObjects</h4>
    <p>
        When reading a node whose value is an ExtensionObject, the structured
        data is automatically serialized to a plain JSON object in
        <code>msg.payload</code>. The <code>msg.dataType</code> will be
        <code>"ExtensionObject"</code>. A <code>_typeName</code> field indicates
        the OPC UA type name.
    </p>
    <p>
        If the server's type definition cannot be resolved, an opaque
        representation with base64-encoded raw bytes is returned (<code
            >_opaque: true</code
        >).
    </p>

    <h4>Writing ExtensionObjects</h4>
    <p>
        Send the struct fields as a plain JSON object in
        <code>msg.payload</code>. The structure type is read from the target
        variable, so no further settings are needed. Nested structures are
        nested objects; an <b>array of structures</b> is an array of objects.
    </p>
    <p>Example:</p>
    <pre>
msg = {
    operation: "write",
    nodeId: "ns=2;s=MyStructVar",
    payload: {
        temperature: 25.5,
        unit: "Celsius",
        timestamp: "2024-01-01T00:00:00Z"
    }
}</pre
    >
    <p>
        <code>msg.datatype = "ExtensionObject"</code> with
        <code>msg.dataTypeNodeId</code> (e.g. <code>"ns=2;i=3003"</code>) is
        still accepted and only needed when the variable is declared with an
        abstract type. A write replaces the <b>whole</b> structure: fields left
        out are written with their default value. To change one field, read
        the structure, change it and write it back.
    </p>

    <h3>Item Collector Pattern</h3>
    <p>
        Chain <b>OPC UA Item</b> nodes in series before the client. Each item
        adds itself to the <code>msg.items</code> array for batch operations.
    </p>
</script>
