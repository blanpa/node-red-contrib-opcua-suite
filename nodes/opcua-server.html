<link rel="stylesheet" href="resources/node-red-contrib-opcua-suite/opcua-editor.css" />
<script src="resources/node-red-contrib-opcua-suite/opcua-editor.js"></script>

<script type="text/javascript">
    RED.nodes.registerType("opcua-server", {
        category: "OPC UA Suite",
        color: "#3a8cba",
        defaults: {
            name: { value: "" },
            port: {
                value: 4840,
                validate: function (v) {
                    var n = parseInt(v, 10);
                    return n >= 1 && n <= 65535;
                },
            },
            serverName: { value: "Node-RED OPC UA Server" },
            maxAllowedSessionNumber: { value: 10, validate: RED.validators.number() },
            maxConnectionsPerEndpoint: { value: 10, validate: RED.validators.number() },
            allowMsgFunc: { value: false },
        },
        inputs: 1,
        outputs: 1,
        icon: "opcua.svg",
        paletteLabel: "OPC UA Server",
        label: function () {
            return this.name || "OPC UA Server";
        },
        labelStyle: function () {
            return this.name ? "node_label_italic" : "";
        },
        oneditprepare: function () {
            var node = this;
            function updateUrl() {
                var port = $("#node-input-port").val() || "4840";
                $("#opcua-server-url").text("opc.tcp://<host>:" + port + "/UA/NodeRED");
            }
            $("#node-input-port").on("input change", updateUrl);
            updateUrl();
            if (Number(node.maxAllowedSessionNumber) !== 10 || Number(node.maxConnectionsPerEndpoint) !== 10) {
                OpcUaEditor.expand("#opcua-server-limits");
            }
            if (node.allowMsgFunc === true || node.allowMsgFunc === "true") {
                OpcUaEditor.expand("#opcua-server-security");
            }
            OpcUaEditor.sections("#opcua-server-form");
        },
    });
</script>

<script type="text/html" data-template-name="opcua-server">
    <div class="opcua-form" id="opcua-server-form">
        <div class="form-row">
            <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
            <input type="text" id="node-input-name" placeholder="Name" />
        </div>
        <div class="form-row">
            <label for="node-input-port"><i class="fa fa-plug"></i> Port</label>
            <input type="number" class="opcua-num" id="node-input-port" min="1" max="65535" placeholder="4840" />
        </div>
        <div class="opcua-hint">Clients connect to <code id="opcua-server-url"></code></div>
        <div class="form-row">
            <label for="node-input-serverName"><i class="fa fa-server"></i> Server name</label>
            <input type="text" id="node-input-serverName" placeholder="Node-RED OPC UA Server" />
        </div>

        <div class="opcua-section opcua-collapsed" id="opcua-server-limits">
            <div class="opcua-section-header">
                <i class="fa opcua-chevron"></i>
                <span class="opcua-section-title">Limits</span>
            </div>
            <div class="opcua-section-body">
                <div class="form-row">
                    <label for="node-input-maxAllowedSessionNumber"><i class="fa fa-users"></i> Sessions</label>
                    <input type="number" class="opcua-num" id="node-input-maxAllowedSessionNumber" min="1" max="100" placeholder="10" />
                    <span class="opcua-unit">at most</span>
                </div>
                <div class="form-row">
                    <label for="node-input-maxConnectionsPerEndpoint"><i class="fa fa-link"></i> Connections</label>
                    <input type="number" class="opcua-num" id="node-input-maxConnectionsPerEndpoint" min="1" max="100" placeholder="10" />
                    <span class="opcua-unit">at most, per endpoint</span>
                </div>
            </div>
        </div>

        <div class="opcua-section opcua-collapsed" id="opcua-server-security">
            <div class="opcua-section-header">
                <i class="fa opcua-chevron"></i>
                <span class="opcua-section-title">Security</span>
            </div>
            <div class="opcua-section-body">
                <div class="opcua-check opcua-check-block">
                    <input type="checkbox" id="node-input-allowMsgFunc" />
                    <label for="node-input-allowMsgFunc">
                        Allow method code from <code>msg.func</code>
                        <span class="opcua-check-hint">Off by default.</span>
                    </label>
                </div>
                <div class="opcua-note opcua-note-warning">
                    When enabled, the <code>addMethod</code> command runs the JavaScript in
                    <code>msg.func</code> with <code>new Function()</code>. That code arrives with
                    the message, so any upstream node fed from outside (<code>http in</code>,
                    MQTT, ...) could run arbitrary code in the Node-RED process. Enable it only
                    when every path into this node is trusted.
                </div>
            </div>
        </div>
    </div>
</script>

<script type="text/html" data-help-name="opcua-server">
    <p>OPC UA Server Node for providing OPC UA data.</p>
    <h3>Commands</h3>
    <p>Via <code>msg.command</code>:</p>
    <ul>
        <li><code>addFolder</code> — Add folder</li>
        <li><code>addVariable</code> — Add variable</li>
        <li><code>setValue</code> — Set value</li>
        <li><code>deleteNode</code> — Delete node</li>
        <li><code>addMethod</code> — Add method (requires <code>msg.parentNodeId</code> of an object, e.g. created via <code>addObject</code>). A custom handler via <code>msg.func</code> requires <i>Allow method code from msg.func</i> to be enabled under <b>Security</b>.</li>
        <li><code>addObject</code> — Add object</li>
        <li><code>getServerInfo</code> — Server diagnostics</li>
        <li><code>setWritable</code> — Make variable writable</li>
        <li><code>raiseEvent</code> — Raise event</li>
    </ul>
</script>
