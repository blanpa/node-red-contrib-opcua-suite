<link rel="stylesheet" href="resources/node-red-contrib-opcua-suite/opcua-editor.css" />
<script src="resources/node-red-contrib-opcua-suite/opcua-editor.js"></script>

<script type="text/javascript">
    (function () {
        // Operations the item node can set. test/editor-contract.test.js
        // checks them against opcua-item.js and opcua-client.js.
        var ITEM_OPERATIONS = [
            ["", "Do not set (client default or msg.operation)"],
            ["read", "Read"],
            ["readmultiple", "Read multiple"],
            ["write", "Write"],
            ["writemultiple", "Write multiple"],
            ["subscribe", "Subscribe"],
            ["unsubscribe", "Unsubscribe"],
        ];

        var DATATYPE_OPTIONS =
            '<option value="">Auto</option>' +
            '<optgroup label="Boolean and integers">' +
            ["Boolean", "SByte", "Int16", "Int32", "Int64", "Byte", "UInt16", "UInt32", "UInt64"]
                .map(function (t) { return '<option value="' + t + '">' + t + "</option>"; }).join("") +
            "</optgroup>" +
            '<optgroup label="Floating point"><option value="Float">Float</option><option value="Double">Double</option></optgroup>' +
            '<optgroup label="Text and time">' +
            ["String", "DateTime", "LocalizedText", "QualifiedName", "XmlElement"]
                .map(function (t) { return '<option value="' + t + '">' + t + "</option>"; }).join("") +
            "</optgroup>" +
            '<optgroup label="Binary and identifiers">' +
            ["ByteString", "Guid", "NodeId", "ExpandedNodeId", "StatusCode"]
                .map(function (t) { return '<option value="' + t + '">' + t + "</option>"; }).join("") +
            "</optgroup>" +
            '<optgroup label="Structured"><option value="ExtensionObject">ExtensionObject</option></optgroup>' +
            '<optgroup label="Rarely writable">' +
            ["DataValue", "Variant", "DiagnosticInfo"]
                .map(function (t) { return '<option value="' + t + '">' + t + "</option>"; }).join("") +
            "</optgroup>";

        RED.nodes.registerType("opcua-item", {
            category: "OPC UA Suite",
            color: "#3a8cba",
            defaults: {
                name: { value: "" },
                collector: { value: true },
                operation: { value: "" },
                unwrapSingle: { value: false },
                items: { value: [] },
            },
            inputs: 1,
            outputs: 1,
            icon: "opcua.svg",
            paletteLabel: "OPC UA Item",
            label: function () {
                if (this.name) return this.name;
                var count = this.items ? this.items.length : 0;
                if (count === 0) return "OPC UA Item";
                if (count === 1) return this.items[0].itemName || this.items[0].nodeId || "OPC UA Item";
                return count + " items";
            },
            labelStyle: function () {
                return this.name ? "node_label_italic" : "";
            },
            oneditprepare: function () {
                var node = this;
                var $list = $("#opcua-item-list");

                var $op = $("#node-input-operation");
                ITEM_OPERATIONS.forEach(function (o) {
                    $("<option>").val(o[0]).text(o[1]).appendTo($op);
                });
                OpcUaEditor.keepValue($op, node.operation || "");

                function addRow(item) {
                    item = item || {};
                    var $wrap = $('<div class="opcua-item-entry"></div>');
                    var $row = $('<div class="opcua-table-row"></div>').appendTo($wrap);
                    var $cell = $('<span class="opcua-col-grow opcua-cell"></span>').appendTo($row);
                    var $nid = $('<input type="text" class="opcua-item-nodeid" placeholder="ns=2;s=Variable">')
                        .val(item.nodeId || "").appendTo($cell);
                    var $name = $('<input type="text" class="opcua-col-grow opcua-item-name" placeholder="Name">')
                        .val(item.itemName || "").appendTo($row);
                    var $dt = $('<select class="opcua-col-type opcua-item-datatype">' + DATATYPE_OPTIONS + "</select>").appendTo($row);
                    OpcUaEditor.keepValue($dt, item.datatype || "");
                    var $arr = $('<span class="opcua-col-small"><input type="checkbox" class="opcua-item-array" title="Write the value as an array"></span>').appendTo($row);
                    $arr.find("input").prop("checked", !!item.arrayType);
                    var $remove = $('<button type="button" class="red-ui-button red-ui-button-small opcua-col-btn" title="Remove"><i class="fa fa-times"></i></button>').appendTo($row);

                    var $ext = $('<div class="opcua-table-row opcua-item-ext"></div>').appendTo($wrap);
                    $('<span class="opcua-unit">Structure type</span>').appendTo($ext);
                    var $dtn = $('<input type="text" class="opcua-col-grow opcua-item-dtnodeid" placeholder="DataType NodeId, only for abstract variables, e.g. ns=2;i=3003">')
                        .val(item.dataTypeNodeId || "").appendTo($ext);

                    function syncExt() {
                        $ext.toggle($dt.val() === "ExtensionObject");
                    }
                    $dt.on("change", syncExt);
                    syncExt();

                    // Browse button: fills NodeId, and Name / DataType when empty.
                    OpcUaEditor.attachPicker($nid, {
                        classes: ["Variable"],
                        title: "Select a variable",
                        compact: true,
                        onPick: function (ref) {
                            if (!$name.val()) $name.val(ref.browseName || "");
                            if (!$dt.val() && ref.dataType && $dt.find('option[value="' + ref.dataType + '"]').length) {
                                $dt.val(ref.dataType).trigger("change");
                            }
                        },
                    }).addClass("red-ui-button-small opcua-col-btn");

                    $remove.on("click", function () {
                        $wrap.remove();
                        updatePreview();
                    });
                    $wrap.insertBefore("#opcua-item-empty");
                    updatePreview();
                }

                $("#opcua-item-add").on("click", function () {
                    addRow({});
                });

                // Older versions stored a single item or an itemList.
                var items = (node.items || []).slice();
                if (items.length === 0) {
                    if (node.nodeId) {
                        items.push({ nodeId: node.nodeId, itemName: node.itemName || "", datatype: node.datatype || "" });
                    }
                    (node.itemList || []).forEach(function (it) {
                        items.push(it);
                    });
                }
                items.forEach(addRow);

                function updatePreview() {
                    var count = $list.find(".opcua-item-entry").length;
                    $("#opcua-item-empty").toggle(count === 0);
                    var collector = $("#node-input-collector").is(":checked");
                    var text;
                    if (count === 0) text = "No items: messages pass through unchanged.";
                    else if (collector) text = count + (count === 1 ? " item is" : " items are") + " appended to msg.items.";
                    else text = "Sets msg.topic to the first item" + (count > 1 ? "; the other " + (count - 1) + " are ignored." : ".");
                    $("#opcua-item-preview").text(text);
                }
                $("#node-input-collector").on("change", updatePreview);
                updatePreview();
                OpcUaEditor.sections("#opcua-item-form");
            },
            oneditsave: function () {
                var items = [];
                $("#opcua-item-list .opcua-item-entry").each(function () {
                    var nodeId = ($(this).find(".opcua-item-nodeid").val() || "").trim();
                    if (!nodeId) return;
                    var item = {
                        nodeId: nodeId,
                        itemName: ($(this).find(".opcua-item-name").val() || "").trim(),
                        datatype: $(this).find(".opcua-item-datatype").val() || "",
                    };
                    var dtn = ($(this).find(".opcua-item-dtnodeid").val() || "").trim();
                    if (dtn) item.dataTypeNodeId = dtn;
                    if ($(this).find(".opcua-item-array").is(":checked")) item.arrayType = "Array";
                    items.push(item);
                });
                this.items = items;
            },
        });
    })();
</script>

<script type="text/html" data-template-name="opcua-item">
    <div class="opcua-form" id="opcua-item-form">
        <div class="form-row">
            <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
            <input type="text" id="node-input-name" placeholder="Name" />
        </div>

        <div class="opcua-section" id="opcua-item-items">
            <div class="opcua-section-header">
                <i class="fa opcua-chevron"></i>
                <span class="opcua-section-title">Items</span>
            </div>
            <div class="opcua-section-body" id="opcua-item-list">
                <div class="opcua-table-head">
                    <span class="opcua-col-grow">NodeId</span>
                    <span class="opcua-col-grow">Name</span>
                    <span class="opcua-col-type">DataType (write)</span>
                    <span class="opcua-col-small" title="Write the value as an array">Array</span>
                    <span class="opcua-col-btn" style="width:24px"></span>
                </div>
                <div class="opcua-empty" id="opcua-item-empty">No items yet.</div>
                <div class="opcua-toolbar">
                    <button type="button" id="opcua-item-add" class="red-ui-button red-ui-button-small"><i class="fa fa-plus"></i> Add item</button>
                    <span class="opcua-spacer"></span>
                    <span class="opcua-unit" id="opcua-item-preview"></span>
                </div>
            </div>
        </div>

        <div class="form-row">
            <label for="node-input-operation"><i class="fa fa-cog"></i> Operation</label>
            <select id="node-input-operation"></select>
        </div>
        <div class="opcua-check">
            <input type="checkbox" id="node-input-collector" />
            <label for="node-input-collector">
                Collect into msg.items
                <span class="opcua-check-hint">For batch reads and writes. Off: sets msg.topic to the first item.</span>
            </label>
        </div>
        <div class="opcua-check">
            <input type="checkbox" id="node-input-unwrapSingle" />
            <label for="node-input-unwrapSingle">
                Unwrap a single value
                <span class="opcua-check-hint">A read of one item returns the value itself, not a one-element array.</span>
            </label>
        </div>
    </div>
</script>

<script type="text/html" data-help-name="opcua-item">
    <p>Defines OPC UA items (variables) for read/write operations.</p>

    <h3>Items</h3>
    <p>Add one or more items via the <b>Add item</b> button. Each item needs a <b>NodeId</b>,
    and optionally a <b>Name</b>, a <b>DataType</b> and the <b>Array</b> flag.</p>
    <p><b>Browse</b> next to the NodeId picks a variable from a deployed endpoint and fills
    in an empty name and data type.</p>

    <h4>DataType (write only)</h4>
    <p>The DataType is used for <b>writes</b> only — reads always return the server's type.
    The dropdown lists the full OPC UA type set. <b>Auto</b> infers the type from the JS value.
    The payload is converted from its JSON form — e.g. an ISO string or epoch ms for
    <code>DateTime</code>, <code>"ns=2;s=X"</code> for <code>NodeId</code>, base64 for
    <code>ByteString</code>; a value that does not fit is reported as an error.
    The <i>Advanced</i> types (<code>DataValue</code>, <code>Variant</code>, <code>DiagnosticInfo</code>)
    are rarely writable as a variable value and will surface a server error if the value does not
    match — they are offered for completeness.</p>

    <h4>Array (ValueRank)</h4>
    <p>Tick <b>Array</b> to write the value as an <b>array</b> (e.g. <code>Int32[]</code>).
    The payload must then be a JS array. Sets <code>arrayType: "Array"</code> on the item.</p>

    <h4>ExtensionObject (structured types)</h4>
    <p>The payload is a plain JSON object of the struct fields (or an array of them with
    <code>[]</code>). <b>Auto</b> already writes it as a structure, using the variable's own type.
    Selecting <b>ExtensionObject</b> reveals an optional <b>DataType NodeId</b> field
    (e.g. <code>ns=2;i=3003</code>), needed only when the variable is declared with an abstract
    type. A write replaces the whole structure — fields left out get their default value.
    Reading ExtensionObjects needs no configuration — they come back as JSON automatically.</p>

    <h4>Chain Pattern</h4>
    <p>Multiple Item nodes can be chained — each adds its items to <code>msg.items</code>:</p>
    <pre>[Inject] → [Item: Temp] → [Item: Press] → [Client]</pre>

    <h4>Batch Pattern</h4>
    <p>Or configure all items in a single node:</p>
    <pre>[Inject] → [Items: Temp, Press, Flow] → [Client]</pre>

    <h3>Collector Mode (default: active)</h3>
    <p>Adds items to the <code>msg.items</code> array for batch operations.</p>

    <h3>Single mode (Collect into msg.items off)</h3>
    <p>Sets <code>msg.topic</code> and <code>msg.datatype</code> directly — only uses the first item.</p>

    <h3>Operation</h3>
    <p>Optionally sets <code>msg.operation</code> so the downstream Client knows what to do
    (read, read multiple, write, write multiple, subscribe, unsubscribe). Leave it on
    <i>Do not set</i> to keep the Client's operation or an existing <code>msg.operation</code>.</p>

    <h3>Unwrap single value</h3>
    <p>When reading and exactly one item is resolved, the Client returns the scalar value in
    <code>msg.payload</code> (e.g. <code>false</code>) instead of a one-element array
    (<code>[{value:false, ...}]</code>). Sets <code>msg.unwrapSingle = true</code>.</p>
</script>
