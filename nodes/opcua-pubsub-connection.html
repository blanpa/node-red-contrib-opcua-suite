<link rel="stylesheet" href="resources/node-red-contrib-opcua-suite/opcua-editor.css" />
<script src="resources/node-red-contrib-opcua-suite/opcua-editor.js"></script>

<script type="text/javascript">
    (function () {
        // Upload route prefix, matches lib/cert-store.js.
        var CERT_ROUTE_PREFIX = "opcua-pubsub-connection";

        // Browser-side UUID v4 for a new String PublisherId.
        function generatePubSubUUID() {
            var bytes = new Uint8Array(16);
            (window.crypto || window.msCrypto).getRandomValues(bytes);
            bytes[6] = (bytes[6] & 0x0f) | 0x40;
            bytes[8] = (bytes[8] & 0x3f) | 0x80;
            var hex = [];
            for (var i = 0; i < 16; i++) hex.push((bytes[i] + 0x100).toString(16).substr(1));
            return (
                hex.slice(0, 4).join("") + "-" + hex.slice(4, 6).join("") + "-" +
                hex.slice(6, 8).join("") + "-" + hex.slice(8, 10).join("") + "-" +
                hex.slice(10, 16).join("")
            );
        }

        RED.nodes.registerType("opcua-pubsub-connection", {
            category: "config",
            color: "#3a8cba",
            paletteLabel: "OPC UA PubSub Connection",
            defaults: {
                name: { value: "" },
                transportType: { value: "udp" },
                multicastGroup: { value: "239.0.0.1" },
                multicastInterface: { value: "0.0.0.0" },
                port: { value: 4840 },
                mtu: { value: 1400 },
                brokerUrl: { value: "mqtt://localhost:1883" },
                topicPrefix: { value: "ua" },
                qos: { value: 1 },
                publisherIdType: { value: "String" },
                publisherId: { value: "" },
                // Reserved for client-certificate MQTT (mTLS). Not used yet and
                // not shown, but kept so stored flows keep their values.
                certificateFile: { value: "" },
                privateKeyFile: { value: "" },
                caCertificateFile: { value: "" },
            },
            credentials: {
                userName: { type: "text" },
                password: { type: "password" },
            },
            icon: "opcua.svg",
            label: function () {
                return this.name || "OPC UA PubSub Connection";
            },
            labelStyle: function () {
                return this.name ? "node_label_italic" : "";
            },
            oneditprepare: function () {
                var node = this;
                if ((node.publisherId === "" || node.publisherId === undefined) && (node.publisherIdType || "String") === "String") {
                    $("#node-config-input-publisherId").val(generatePubSubUUID());
                }
                OpcUaEditor.keepValue("#node-config-input-qos", node.qos !== undefined ? node.qos : 1);

                function updateTransportUI() {
                    var mqtt = $("#node-config-input-transportType").val() === "mqtt";
                    $("#opcua-psc-udp").toggle(!mqtt);
                    $("#opcua-psc-mqtt").toggle(mqtt);
                }
                $("#node-config-input-transportType").on("change", updateTransportUI);
                updateTransportUI();

                function updatePublisherIdUI() {
                    var t = $("#node-config-input-publisherIdType").val();
                    $("#node-config-input-publisherId").attr("type", t === "String" ? "text" : "number");
                    $("#opcua-psc-new-uuid").toggle(t === "String");
                }
                $("#node-config-input-publisherIdType").on("change", updatePublisherIdUI);
                updatePublisherIdUI();
                $("#opcua-psc-new-uuid").on("click", function () {
                    $("#node-config-input-publisherId").val(generatePubSubUUID());
                });
                OpcUaEditor.sections("#opcua-psc-form");
            },
        });
    })();
</script>

<script type="text/html" data-template-name="opcua-pubsub-connection">
    <div class="opcua-form" id="opcua-psc-form">
        <div class="form-row">
            <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
            <input type="text" id="node-config-input-name" placeholder="Name" />
        </div>
        <div class="form-row">
            <label for="node-config-input-transportType"><i class="fa fa-exchange"></i> Transport</label>
            <select id="node-config-input-transportType">
                <option value="udp">UDP multicast (UADP)</option>
                <option value="mqtt">MQTT</option>
            </select>
        </div>

        <div class="opcua-section" id="opcua-psc-udp">
            <div class="opcua-section-header">
                <i class="fa opcua-chevron"></i>
                <span class="opcua-section-title">UDP</span>
            </div>
            <div class="opcua-section-body">
                <div class="form-row">
                    <label for="node-config-input-multicastGroup"><i class="fa fa-users"></i> Group</label>
                    <input type="text" id="node-config-input-multicastGroup" placeholder="239.0.0.1" />
                </div>
                <div class="form-row">
                    <label for="node-config-input-port"><i class="fa fa-plug"></i> Port</label>
                    <input type="number" class="opcua-num" id="node-config-input-port" min="1" max="65535" placeholder="4840" />
                </div>
                <div class="form-row">
                    <label for="node-config-input-multicastInterface"><i class="fa fa-sitemap"></i> Interface</label>
                    <input type="text" id="node-config-input-multicastInterface" placeholder="0.0.0.0" />
                </div>
                <div class="opcua-hint">
                    <code>0.0.0.0</code> lets the OS choose the network card. On a host with several
                    cards, enter its address on the PubSub network if nothing is received.
                </div>
                <div class="form-row">
                    <label for="node-config-input-mtu"><i class="fa fa-arrows-h"></i> MTU</label>
                    <input type="number" class="opcua-num" id="node-config-input-mtu" min="100" placeholder="1400" />
                    <span class="opcua-unit">bytes</span>
                </div>
                <div class="opcua-hint">
                    Bounds the size of chunked messages this connection reassembles. Outgoing
                    messages are split by the publisher's <i>Max size</i>.
                </div>
            </div>
        </div>

        <div class="opcua-section" id="opcua-psc-mqtt">
            <div class="opcua-section-header">
                <i class="fa opcua-chevron"></i>
                <span class="opcua-section-title">MQTT</span>
            </div>
            <div class="opcua-section-body">
                <div class="form-row">
                    <label for="node-config-input-brokerUrl"><i class="fa fa-link"></i> Broker URL</label>
                    <input type="text" id="node-config-input-brokerUrl" placeholder="mqtt://localhost:1883" />
                </div>
                <div class="opcua-hint"><code>mqtts://</code> uses TLS and checks the broker certificate against the system trust store.</div>
                <div class="form-row">
                    <label for="node-config-input-topicPrefix"><i class="fa fa-folder"></i> Topic prefix</label>
                    <input type="text" id="node-config-input-topicPrefix" placeholder="ua" />
                </div>
                <div class="opcua-hint">Topics are <code>prefix/publisherId/groupId/writerId</code>; <code>/ + #</code> are not allowed in the prefix.</div>
                <div class="form-row">
                    <label for="node-config-input-qos"><i class="fa fa-check-circle"></i> QoS</label>
                    <select id="node-config-input-qos">
                        <option value="0">0, at most once</option>
                        <option value="1">1, at least once</option>
                        <option value="2">2, exactly once</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="node-config-input-userName"><i class="fa fa-user"></i> Username</label>
                    <input type="text" id="node-config-input-userName" placeholder="empty = anonymous" />
                </div>
                <div class="form-row">
                    <label for="node-config-input-password"><i class="fa fa-key"></i> Password</label>
                    <input type="password" id="node-config-input-password" />
                </div>
            </div>
        </div>

        <div class="opcua-section" id="opcua-psc-identity">
            <div class="opcua-section-header">
                <i class="fa opcua-chevron"></i>
                <span class="opcua-section-title">Publisher identity</span>
            </div>
            <div class="opcua-section-body">
                <div class="form-row">
                    <label for="node-config-input-publisherIdType"><i class="fa fa-tags"></i> Id type</label>
                    <select id="node-config-input-publisherIdType">
                        <option value="String">String</option>
                        <option value="UInt16">UInt16</option>
                        <option value="UInt32">UInt32</option>
                        <option value="UInt64">UInt64</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="node-config-input-publisherId"><i class="fa fa-hashtag"></i> Publisher id</label>
                    <input type="text" id="node-config-input-publisherId" />
                    <button type="button" id="opcua-psc-new-uuid" class="red-ui-button" title="Generate a new UUID">New</button>
                </div>
                <div class="opcua-hint">Identifies messages sent through this connection. Subscribers filter on it.</div>
            </div>
        </div>
    </div>
</script>

<script type="text/html" data-help-name="opcua-pubsub-connection">
    <p>OPC UA <strong>PubSub</strong> connection. It owns one transport (UDP-UADP multicast or
    MQTT) that all publisher and subscriber nodes using it share. A redeploy reuses the transport
    for 500&nbsp;ms, so it is not torn down and rebuilt.</p>

    <h3>Transport Type</h3>
    <p>Choose <code>UDP</code> for UADP multicast on a local network, or <code>MQTT</code> for
    broker-mediated PubSub.</p>

    <h3>UDP</h3>
    <ul>
        <li>The socket always binds to <code>0.0.0.0</code> (never a NIC IP nor the multicast group).</li>
        <li><strong>Multicast Interface</strong>: leave <code>0.0.0.0</code> to let the OS pick; on a
        multi-NIC host set the host's IP on the PubSub LAN if traffic isn't received.</li>
        <li><strong>MTU</strong> bounds the size of chunked messages this connection reassembles.
        Outgoing messages are split according to the publisher's <i>Max size</i>.</li>
    </ul>

    <h3>MQTT</h3>
    <ul>
        <li><code>mqtt://</code> = plaintext; <code>mqtts://</code> = TLS (system trust store, no bypass).</li>
        <li>Data topics are published with <code>retain=false</code>.</li>
        <li>Topic structure: <code>{prefix}/{publisherId}/{writerGroupId}/{dataSetWriterId}</code>.
        The <code>/</code>, <code>+</code>, <code>#</code> characters are forbidden in user-controlled
        components.</li>
    </ul>

    <h3>PublisherId</h3>
    <p>Per OPC UA Part 14 §6.2 a PublisherId is one of: <strong>String</strong>, <strong>UInt16</strong>,
    <strong>UInt32</strong>, <strong>UInt64</strong>. New connections default to a String UUID v4.</p>
</script>
