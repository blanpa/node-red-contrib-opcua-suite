<link rel="stylesheet" href="resources/node-red-contrib-opcua-suite/opcua-editor.css" />
<script src="resources/node-red-contrib-opcua-suite/opcua-editor.js"></script>

<script type="text/javascript">
    RED.nodes.registerType("opcua-browser", {
        category: "OPC UA Suite",
        color: "#3a8cba",
        defaults: {
            name: { value: "" },
            endpoint: { value: "", type: "opcua-endpoint", required: true },
            startNodeId: { value: "RootFolder" },
            recursive: { value: false },
            maxDepth: { value: 10, validate: RED.validators.number() },
        },
        inputs: 1,
        outputs: 1,
        icon: "opcua.svg",
        paletteLabel: "OPC UA Browser",
        label: function () {
            return this.name || "OPC UA Browser";
        },
        labelStyle: function () {
            return this.name ? "node_label_italic" : "";
        },
        oneditprepare: function () {
            OpcUaEditor.attachPicker($("#node-input-startNodeId"), {
                endpoint: function () {
                    return $("#node-input-endpoint").val();
                },
                title: "Select the start node",
            });
            function toggleDepth() {
                $("#opcua-browser-depth-row").toggle($("#node-input-recursive").is(":checked"));
            }
            $("#node-input-recursive").on("change", toggleDepth);
            toggleDepth();
        },
    });
</script>

<script type="text/html" data-template-name="opcua-browser">
    <div class="opcua-form" id="opcua-browser-form">
        <div class="form-row">
            <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
            <input type="text" id="node-input-name" placeholder="Name" />
        </div>
        <div class="form-row">
            <label for="node-input-endpoint"><i class="fa fa-plug"></i> Endpoint</label>
            <input type="text" id="node-input-endpoint" />
        </div>
        <div class="form-row">
            <label for="node-input-startNodeId"><i class="fa fa-folder-open"></i> Start node</label>
            <input type="text" id="node-input-startNodeId" placeholder="RootFolder" />
        </div>
        <div class="opcua-hint"><code>msg.topic</code> or <code>msg.nodeId</code> overrides it.</div>
        <div class="opcua-check">
            <input type="checkbox" id="node-input-recursive" />
            <label for="node-input-recursive">
                Recursive
                <span class="opcua-check-hint">Also browse the subtree into <code>msg.recursiveResult</code>.</span>
            </label>
        </div>
        <div class="form-row" id="opcua-browser-depth-row">
            <label for="node-input-maxDepth"><i class="fa fa-level-down"></i> Max depth</label>
            <input type="number" class="opcua-num" id="node-input-maxDepth" min="1" max="20" placeholder="10" />
            <span class="opcua-unit">levels</span>
        </div>
    </div>
</script>

<script type="text/html" data-help-name="opcua-browser">
    <p>OPC UA Browser Node for browsing the OPC UA address space.</p>
    <h3>Input</h3>
    <p>The NodeId can be set via <code>msg.topic</code> or <code>msg.nodeId</code>.
    If not set, the configured start NodeId is used.</p>
    <h3>Output</h3>
    <p><code>msg.payload</code> contains an array of references:</p>
    <ul>
        <li><code>browseName</code> — Node name</li>
        <li><code>nodeId</code> — NodeId as string</li>
        <li><code>nodeClass</code> — Node class (Object, Variable, etc.)</li>
        <li><code>typeDefinition</code> — Type definition</li>
    </ul>
    <h3>Recursive</h3>
    <p>When recursive mode is enabled, the result is delivered in <code>msg.recursiveResult</code> as a tree structure.</p>
</script>
