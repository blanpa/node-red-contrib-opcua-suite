<link rel="stylesheet" href="resources/node-red-contrib-opcua-suite/opcua-editor.css" />
<script src="resources/node-red-contrib-opcua-suite/opcua-editor.js"></script>

<script type="text/javascript">
    (function () {
        // Upload route prefix, matches lib/cert-store.js.
        var CERT_ROUTE_PREFIX = "opcua-endpoint";

        function optionalInt(min) {
            return function (v) {
                return v === "" || v === undefined || v === null || parseInt(v, 10) >= min;
            };
        }

        RED.nodes.registerType("opcua-endpoint", {
            category: "config",
            color: "#3a8cba",
            paletteLabel: "OPC UA Endpoint",
            defaults: {
                name: { value: "" },
                endpointUrl: {
                    value: "opc.tcp://localhost:4840",
                    required: true,
                    validate: function (v) {
                        // ${ENV_VAR} values are resolved by Node-RED at deploy time.
                        return /^\$\{\w+\}$/.test(v || "") ||
                            /^opc\.tcp:\/\/[^/]+(:\d+)?(\/.*)?$/.test(v || "");
                    },
                },
                securityMode: { value: "None" },
                securityPolicy: { value: "None" },
                certificateFile: { value: "" },
                privateKeyFile: { value: "" },
                caCertificateFile: { value: "" },
                userCertificateFile: { value: "" },
                userPrivateKeyFile: { value: "" },
                poolSize: { value: 1, validate: optionalInt(1) },
                operationTimeout: { value: 10000, validate: optionalInt(1000) },
                // Empty = not set here: the first node opening the shared
                // connection may still provide a value (older flows), else
                // the built-in default applies.
                applicationName: { value: "" },
                maxReconnectAttempts: { value: "", validate: optionalInt(0) },
                reconnectDelay: { value: "", validate: optionalInt(100) },
            },
            credentials: {
                userName: { type: "text" },
                password: { type: "password" },
            },
            icon: "opcua.svg",
            label: function () {
                return this.name || this.endpointUrl || "OPC UA Endpoint";
            },
            labelStyle: function () {
                return this.name ? "node_label_italic" : "";
            },
            oneditprepare: function () {
                var node = this;

                // --- Security ---
                function updateSecurityUI() {
                    var none = $("#node-config-input-securityMode").val() === "None";
                    $("#opcua-ep-policy-row").toggle(!none);
                    $("#opcua-ep-none-hint").toggle(none);
                    $("#opcua-ep-certs").toggle(!none);
                    if (!none && $("#node-config-input-securityPolicy").val() === "None") {
                        $("#node-config-input-securityPolicy").val("Basic256Sha256");
                    }
                    updatePolicyHint();
                }
                function updatePolicyHint() {
                    var p = $("#node-config-input-securityPolicy").val();
                    var deprecated = p === "Basic128Rsa15" || p === "Basic256";
                    var none = $("#node-config-input-securityMode").val() === "None";
                    $("#opcua-ep-deprecated").toggle(deprecated && !none);
                }
                OpcUaEditor.keepValue("#node-config-input-securityMode", node.securityMode || "None");
                OpcUaEditor.keepValue("#node-config-input-securityPolicy", node.securityPolicy || "None");
                $("#node-config-input-securityMode").on("change", updateSecurityUI);
                $("#node-config-input-securityPolicy").on("change", updatePolicyHint);
                updateSecurityUI();

                // --- Authentication ---
                var creds = node.credentials || {};
                var auth = "anonymous";
                if (node.userCertificateFile) auth = "certificate";
                else if (creds.userName || creds.has_password) auth = "username";
                $("#opcua-ep-auth").val(auth);
                function updateAuthUI() {
                    var a = $("#opcua-ep-auth").val();
                    $("#opcua-ep-auth-username").toggle(a === "username");
                    $("#opcua-ep-auth-certificate").toggle(a === "certificate");
                }
                $("#opcua-ep-auth").on("change", updateAuthUI);
                updateAuthUI();

                // --- Certificates ---
                OpcUaEditor.certUpload("dropzone-cert", "node-config-input-certificateFile", CERT_ROUTE_PREFIX);
                OpcUaEditor.certUpload("dropzone-key", "node-config-input-privateKeyFile", CERT_ROUTE_PREFIX);
                OpcUaEditor.certUpload("dropzone-ca", "node-config-input-caCertificateFile", CERT_ROUTE_PREFIX);
                OpcUaEditor.certUpload("dropzone-usercert", "node-config-input-userCertificateFile", CERT_ROUTE_PREFIX);
                OpcUaEditor.certUpload("dropzone-userkey", "node-config-input-userPrivateKeyFile", CERT_ROUTE_PREFIX);

                // --- Connection behaviour ---
                var tuned =
                    node.applicationName ||
                    node.maxReconnectAttempts !== "" && node.maxReconnectAttempts !== undefined ||
                    node.reconnectDelay !== "" && node.reconnectDelay !== undefined ||
                    Number(node.poolSize) > 1 ||
                    Number(node.operationTimeout) !== 10000;
                if (tuned) OpcUaEditor.expand("#opcua-ep-behaviour");
                OpcUaEditor.sections("#opcua-ep-form");
            },
            oneditsave: function () {
                // Only the chosen authentication is kept, so a value left over
                // from another method can no longer win silently.
                var a = $("#opcua-ep-auth").val();
                if (a !== "username") {
                    $("#node-config-input-userName").val("");
                    $("#node-config-input-password").val("");
                }
                if (a !== "certificate") {
                    $("#node-config-input-userCertificateFile").val("");
                    $("#node-config-input-userPrivateKeyFile").val("");
                    this.userCertificateFile = "";
                    this.userPrivateKeyFile = "";
                }
                if ($("#node-config-input-securityMode").val() === "None") {
                    $("#node-config-input-securityPolicy").val("None");
                    this.securityPolicy = "None";
                }
            },
        });
    })();
</script>

<script type="text/html" data-template-name="opcua-endpoint">
    <div class="opcua-form" id="opcua-ep-form">
        <div class="form-row">
            <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
            <input type="text" id="node-config-input-name" placeholder="Name" />
        </div>
        <div class="form-row">
            <label for="node-config-input-endpointUrl"><i class="fa fa-link"></i> Endpoint URL</label>
            <input type="text" id="node-config-input-endpointUrl" placeholder="opc.tcp://host:4840/path" />
        </div>

        <div class="opcua-section" id="opcua-ep-security">
            <div class="opcua-section-header">
                <i class="fa opcua-chevron"></i>
                <span class="opcua-section-title">Security</span>
            </div>
            <div class="opcua-section-body">
                <div class="form-row">
                    <label for="node-config-input-securityMode"><i class="fa fa-shield"></i> Mode</label>
                    <select id="node-config-input-securityMode">
                        <option value="None">None</option>
                        <option value="Sign">Sign</option>
                        <option value="SignAndEncrypt">Sign and encrypt</option>
                    </select>
                </div>
                <div class="opcua-hint" id="opcua-ep-none-hint">Messages are neither signed nor encrypted.</div>
                <div class="form-row" id="opcua-ep-policy-row">
                    <label for="node-config-input-securityPolicy"><i class="fa fa-lock"></i> Policy</label>
                    <select id="node-config-input-securityPolicy">
                        <option value="None">None</option>
                        <option value="Basic256Sha256">Basic256Sha256</option>
                        <option value="Aes128_Sha256_RsaOaep">Aes128_Sha256_RsaOaep</option>
                        <option value="Aes256_Sha256_RsaPss">Aes256_Sha256_RsaPss</option>
                        <option value="Basic256">Basic256 (deprecated)</option>
                        <option value="Basic128Rsa15">Basic128Rsa15 (deprecated)</option>
                    </select>
                </div>
                <div class="opcua-note opcua-note-warning" id="opcua-ep-deprecated" style="display:none">
                    This policy is deprecated by the OPC Foundation because of weak
                    algorithms. Use it only for servers that offer nothing newer.
                </div>
                <div id="opcua-ep-certs">
                    <div class="opcua-hint opcua-hint-block">
                        Client certificate and key are optional. Without them a self-signed
                        certificate is created automatically; the server has to trust it.
                    </div>
                    <input type="hidden" id="node-config-input-certificateFile" />
                    <div class="cert-dropzone" id="dropzone-cert">
                        <i class="fa fa-cloud-upload cert-icon"></i>
                        <div class="cert-info">
                            <span class="cert-label">Client certificate</span>
                            <span class="cert-status"></span>
                        </div>
                        <span class="cert-clear" title="Remove"><i class="fa fa-times"></i></span>
                        <input type="file" class="cert-file-input" accept=".pem,.der,.crt,.cer" />
                    </div>
                    <input type="hidden" id="node-config-input-privateKeyFile" />
                    <div class="cert-dropzone" id="dropzone-key">
                        <i class="fa fa-cloud-upload cert-icon"></i>
                        <div class="cert-info">
                            <span class="cert-label">Private key</span>
                            <span class="cert-status"></span>
                        </div>
                        <span class="cert-clear" title="Remove"><i class="fa fa-times"></i></span>
                        <input type="file" class="cert-file-input" accept=".pem,.key" />
                    </div>
                    <input type="hidden" id="node-config-input-caCertificateFile" />
                    <div class="cert-dropzone" id="dropzone-ca">
                        <i class="fa fa-cloud-upload cert-icon"></i>
                        <div class="cert-info">
                            <span class="cert-label">Server certificate (optional)</span>
                            <span class="cert-status"></span>
                        </div>
                        <span class="cert-clear" title="Remove"><i class="fa fa-times"></i></span>
                        <input type="file" class="cert-file-input" accept=".pem,.der,.crt,.cer" />
                    </div>
                </div>
            </div>
        </div>

        <div class="opcua-section" id="opcua-ep-authentication">
            <div class="opcua-section-header">
                <i class="fa opcua-chevron"></i>
                <span class="opcua-section-title">Authentication</span>
            </div>
            <div class="opcua-section-body">
                <div class="form-row">
                    <label for="opcua-ep-auth"><i class="fa fa-user"></i> Method</label>
                    <select id="opcua-ep-auth">
                        <option value="anonymous">Anonymous</option>
                        <option value="username">Username and password</option>
                        <option value="certificate">User certificate (X509)</option>
                    </select>
                </div>
                <div id="opcua-ep-auth-username">
                    <div class="form-row">
                        <label for="node-config-input-userName"><i class="fa fa-user"></i> Username</label>
                        <input type="text" id="node-config-input-userName" />
                    </div>
                    <div class="form-row">
                        <label for="node-config-input-password"><i class="fa fa-key"></i> Password</label>
                        <input type="password" id="node-config-input-password" />
                    </div>
                </div>
                <div id="opcua-ep-auth-certificate">
                    <input type="hidden" id="node-config-input-userCertificateFile" />
                    <div class="cert-dropzone" id="dropzone-usercert">
                        <i class="fa fa-cloud-upload cert-icon"></i>
                        <div class="cert-info">
                            <span class="cert-label">User certificate</span>
                            <span class="cert-status"></span>
                        </div>
                        <span class="cert-clear" title="Remove"><i class="fa fa-times"></i></span>
                        <input type="file" class="cert-file-input" accept=".pem,.der,.crt,.cer" />
                    </div>
                    <input type="hidden" id="node-config-input-userPrivateKeyFile" />
                    <div class="cert-dropzone" id="dropzone-userkey">
                        <i class="fa fa-cloud-upload cert-icon"></i>
                        <div class="cert-info">
                            <span class="cert-label">User private key</span>
                            <span class="cert-status"></span>
                        </div>
                        <span class="cert-clear" title="Remove"><i class="fa fa-times"></i></span>
                        <input type="file" class="cert-file-input" accept=".pem,.key" />
                    </div>
                </div>
            </div>
        </div>

        <div class="opcua-section opcua-collapsed" id="opcua-ep-behaviour">
            <div class="opcua-section-header">
                <i class="fa opcua-chevron"></i>
                <span class="opcua-section-title">Connection behaviour</span>
            </div>
            <div class="opcua-section-body">
                <div class="form-row">
                    <label for="node-config-input-maxReconnectAttempts"><i class="fa fa-refresh"></i> Connect tries</label>
                    <input type="number" class="opcua-num" id="node-config-input-maxReconnectAttempts" min="0" max="100" placeholder="10" />
                    <span class="opcua-unit">retries per connect, 0 = one try</span>
                </div>
                <div class="form-row">
                    <label for="node-config-input-reconnectDelay"><i class="fa fa-clock-o"></i> Reconnect delay</label>
                    <input type="number" class="opcua-num" id="node-config-input-reconnectDelay" min="100" max="60000" placeholder="5000" />
                    <span class="opcua-unit">ms</span>
                </div>
                <div class="opcua-hint">
                    After a failed connect the connection keeps retrying in the
                    background; the pause doubles from this delay up to one minute.
                </div>
                <div class="form-row">
                    <label for="node-config-input-operationTimeout"><i class="fa fa-hourglass-half"></i> Timeout</label>
                    <input type="number" class="opcua-num" id="node-config-input-operationTimeout" min="1000" step="500" placeholder="10000" />
                    <span class="opcua-unit">ms per read, write, browse</span>
                </div>
                <div class="form-row">
                    <label for="node-config-input-poolSize"><i class="fa fa-database"></i> Sessions</label>
                    <input type="number" class="opcua-num" id="node-config-input-poolSize" min="1" max="16" placeholder="1" />
                    <span class="opcua-unit">1 = one shared session</span>
                </div>
                <div class="form-row">
                    <label for="node-config-input-applicationName"><i class="fa fa-info-circle"></i> Application</label>
                    <input type="text" id="node-config-input-applicationName" placeholder="Node-RED OPC UA Client" />
                </div>
                <div class="opcua-hint">Empty fields use the default shown in grey.</div>
            </div>
        </div>
    </div>
</script>

<script type="text/html" data-help-name="opcua-endpoint">
    <p>Connection to one OPC UA server. All nodes using the same endpoint share <b>one</b> connection.</p>
    <h3>Security</h3>
    <p><b>Mode</b> None sends messages unprotected; Sign and Sign and encrypt need a <b>Policy</b>.
    Basic256 and Basic128Rsa15 are deprecated and only meant for old servers.</p>
    <p>Client certificate and key are optional. Without them node-opcua creates a self-signed
    certificate, which the server must trust. The optional server certificate pins the
    certificate the server has to present.</p>
    <h3>Authentication</h3>
    <p>Choose one method: anonymous, username and password, or a user certificate with its
    private key. Only the chosen method is saved.</p>
    <h3>Connection behaviour</h3>
    <dl class="message-properties">
        <dt>Connect tries</dt><dd>How often one connect attempt is retried before it fails (default 10).</dd>
        <dt>Reconnect delay</dt><dd>Longest pause between those retries and the starting pause of the background reconnect (default 5000 ms).</dd>
        <dt>Timeout</dt><dd>Limit for each read, write or browse request (default 10000 ms).</dd>
        <dt>Sessions</dt><dd>More than one session spreads stateless requests over several sessions.</dd>
        <dt>Application</dt><dd>Application name the client reports to the server.</dd>
    </dl>
    <p>An empty field uses the default. Flows from older versions may still set connect
    tries, reconnect delay or application name on a client node; such a value applies when
    the endpoint leaves the field empty.</p>
    <h3>Certificates</h3>
    <p>Files are uploaded by drag and drop or a click and stored in the <code>opcua-certs/</code>
    folder of the Node-RED user directory.</p>
</script>
